    <path d="m436 80 44 34 44-34" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="532" cy="68" r="13" fill="#99EA48" stroke="#000" stroke-width="3"/>
