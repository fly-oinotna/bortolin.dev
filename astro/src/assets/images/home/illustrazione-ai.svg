    <path d="M300 230 120 108"/>
    <path d="M300 230 480 108"/>
    <path d="M300 230 120 348"/>
    <path d="M300 230 480 348"/>
  </g>

  <!-- in alto a sinistra: pagina web -->
  <g>
    <rect x="60" y="60" width="120" height="96" rx="18" fill="#fff"/>
    <path d="M78 60h84a18 18 0 0 1 18 18v6H60v-6a18 18 0 0 1 18-18z" fill="#2c2c2e"/>
